# HTTP
server {
    listen 80;
    listen [::]:80;
    server_name diaplys.ru www.diaplys.ru;

    # Для обновления сертификатов
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # на HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diaplys.ru www.diaplys.ru;

    # Пути к сертификатам (внутри контейнера)
    ssl_certificate /etc/letsencrypt/live/diaplys.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diaplys.ru/privkey.pem;

    # SSL-настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    # Статика
    location /static/ {
        alias /staticfiles/;
        expires 30d; # Кэширование для статики
        access_log off;

    # Медиа
    location /media/ {
        alias /media/;
    }

    # Проксирование на Django
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}