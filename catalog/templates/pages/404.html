<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
        }

        /* Анимированная иконка */
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .floating-icon {
            animation: float 3s ease-in-out infinite;
            margin-bottom: 30px;
        }

        .floating-icon i {
            font-size: 80px;
            color: #1a237e;
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #1a237e;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: 4px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
        }

        .error-message {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .search-box {
            max-width: 380px;
            margin: 0 auto 32px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 50px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .search-box input:focus {
            border-color: #1a237e;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
        }

        .search-box button {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: #1a237e;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-box button:hover {
            background: #0d1a5c;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1a237e;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: #0d1a5c;
            transform: translateY(-2px);
            color: white;
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 70px;
            }

            .search-box button {
                position: static;
                transform: none;
                margin-top: 10px;
                width: 100%;
            }

            .search-box input {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="floating-icon">
            <i class="bi bi-binoculars"></i>
        </div>

        <div class="error-code">404</div>

        <h1>Страница не найдена</h1>

        <div class="error-message">
            Извините, мы не можем найти страницу, которую вы ищете.
            Возможно, она была удалена или вы ошиблись в адресе.
        </div>

        <a href="/" class="btn-home">
            <i class="bi bi-house-door-fill"></i>
            Вернуться на главную
        </a>
    </div>

</body>
</html>
