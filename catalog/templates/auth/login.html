{% extends 'base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg" style="border: 1px solid #e3f2fd;">
                <div class="card-header text-center" style="background: #e8eaf6;">
                    <h4 class="mb-0" style="color: #1a237e;">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Вход в систему
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label">Имя пользователя</label>
                            <input type="text" name="username" class="form-control" id="id_username" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" id="id_password" required>
                        </div>

                        <input type="hidden" name="next" value="{{ next }}">

                        <button type="submit" class="btn text-white w-100" style="background: #1a237e;">
                            Войти
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
